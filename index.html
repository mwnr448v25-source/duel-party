<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Duel Party</title>
<style>
:root{--p1:#ff4d6d;--p2:#3fa9ff;--bg:#12121c;--panel:#1d1d2b;--panel2:#26263a;--text:#f2f2f7;--muted:#9a9ab0;--accent:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif;overflow:hidden;user-select:none}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#wrap canvas{grid-area:1/1}
#c3d{display:none;background:#8fd3ff}
canvas{background:#0b0b14;border-radius:16px;box-shadow:0 20px 60px #0008}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,10,20,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.screen.on{display:flex}
.card{background:var(--panel);border-radius:22px;padding:24px 34px;max-width:920px;width:94%;max-height:94vh;overflow:auto;text-align:center;box-shadow:0 30px 80px #000a}
h1{font-size:52px;letter-spacing:2px;background:linear-gradient(90deg,var(--p1),var(--accent),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:40px;margin-bottom:10px}
h3{font-size:18px;color:var(--muted);margin:22px 0 12px;font-weight:600}
.sub{color:var(--muted);margin-bottom:22px}
.players{display:flex;gap:16px;align-items:center;justify-content:center}
.pc{flex:1;background:var(--panel2);border-radius:16px;padding:14px;border:3px solid}
.pc.p1{border-color:var(--p1)}.pc.p2{border-color:var(--p2)}
.pc input{width:100%;background:transparent;border:none;color:var(--text);font:800 24px inherit;font-family:inherit;text-align:center;outline:none}
.pc small{color:var(--muted);display:block;margin-top:6px}
.vs{font-weight:900;font-size:26px;color:var(--accent)}
.opts{display:flex;gap:26px;justify-content:center;margin:18px 0;flex-wrap:wrap;color:var(--muted);align-items:center}
.seg{display:inline-flex;background:var(--panel2);border-radius:10px;padding:3px;margin-left:8px}
.seg button{background:none;border:none;color:var(--muted);padding:6px 12px;border-radius:8px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.seg button.sel{background:var(--accent);color:#111}
.big{background:linear-gradient(90deg,var(--p1),var(--p2));color:#fff;border:none;border-radius:14px;padding:14px 34px;font:800 22px inherit;font-family:inherit;cursor:pointer;transition:transform .1s}
.big:hover{transform:scale(1.04)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
#soloGrid{grid-template-columns:repeat(5,1fr)}
.grid .rec{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:3px}
.tabs{display:inline-flex;background:var(--panel2);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{background:none;border:none;color:var(--muted);padding:10px 28px;border-radius:10px;font:800 18px inherit;font-family:inherit;cursor:pointer}
.tabs button.sel{background:var(--text);color:#111}
.grid button{background:var(--panel2);border:2px solid transparent;border-radius:14px;padding:8px 6px;color:var(--text);font:700 14px inherit;font-family:inherit;cursor:pointer;transition:all .1s}
.grid button:hover{border-color:var(--accent);transform:translateY(-2px)}
.grid .em{font-size:24px;display:block;margin-bottom:4px}
.hint{color:var(--muted);margin-top:20px;font-size:15px}
kbd{display:inline-block;background:#fff;color:#111;border-radius:6px;padding:2px 8px;font:700 14px inherit;font-family:inherit;box-shadow:0 3px 0 #999;margin:0 2px;min-width:24px}
.desc{font-size:19px;line-height:1.5;margin:6px auto 20px;max-width:700px}
.ctrls{display:flex;gap:16px}
.ctrls .pc{text-align:left}
.ctrls .pc b{font-size:20px;display:block;margin-bottom:8px}
.ctrls .row{margin:6px 0;color:var(--muted)}
.ctrls .row kbd{margin-bottom:4px}
.score{font-size:30px;font-weight:900;margin:14px 0}
.score .a{color:var(--p1)}.score .b{color:var(--p2)}
#gui{position:fixed;left:50%;transform:translateX(-50%);width:min(760px,90vw);display:none;gap:8px}
#gui.on{display:flex}
#gui input{flex:1;font:600 20px inherit;font-family:inherit;padding:10px 14px;border-radius:12px;border:3px solid var(--accent);background:#fff;color:#111;outline:none;user-select:text}
#gui button{border:none;border-radius:12px;padding:0 16px;font:800 18px inherit;font-family:inherit;cursor:pointer;background:var(--accent);color:#111}
#gui #gidea{background:var(--panel2);font-size:22px}
.tag{display:inline-block;background:var(--panel2);color:var(--muted);border-radius:99px;padding:4px 14px;font-size:14px;margin-bottom:12px}
.mwrap{width:min(1180px,96vw);height:min(780px,95vh);background:var(--panel);border-radius:22px;box-shadow:0 30px 80px #000a;display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid #ffffff10}
.logo{font-weight:900;font-size:28px;letter-spacing:1px;background:linear-gradient(90deg,var(--p1),var(--accent),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.mhead .tabs{margin:0}
.mhead .tabs button{padding:8px 18px;font-size:16px}
.search{flex:1}
.search input{width:100%;background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:10px 14px;color:var(--text);font:600 15px inherit;font-family:inherit;outline:none;user-select:text}
.search input:focus{border-color:var(--accent)}
.rand{background:var(--panel2);border:none;color:var(--text);border-radius:12px;padding:10px 16px;font:700 15px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.rand:hover{background:#34344c}
.mbody{flex:1;display:flex;min-height:0}
.side{width:240px;flex-shrink:0;padding:6px 16px 16px;border-right:1px solid #ffffff10;overflow:auto;display:flex;flex-direction:column;gap:7px}
.sideTitle{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:800;margin-top:12px}
.pl{background:var(--panel2);border-radius:12px;padding:7px 10px;border-left:5px solid;margin-bottom:6px}
.pl.p1{border-color:var(--p1)}.pl.p2{border-color:var(--p2)}
.pl input{width:100%;background:transparent;border:none;color:var(--text);font:800 17px inherit;font-family:inherit;outline:none;user-select:text}
.pl small{color:var(--muted);font-size:11px;display:block;margin-top:3px}
.pl kbd,.mfoot kbd{font-size:10px;padding:1px 5px;min-width:0;box-shadow:0 2px 0 #999}
.tline{color:var(--muted);font-size:13px;margin:2px 0 8px}
.side .big{font-size:15px;padding:10px 12px;width:100%}
.side .seg{margin-left:4px}
#cats{display:flex;flex-direction:column;gap:2px}
#cats button{display:flex;justify-content:space-between;align-items:center;background:none;border:none;color:var(--text);padding:8px 10px;border-radius:10px;font:600 15px inherit;font-family:inherit;cursor:pointer;text-align:left}
#cats button:hover{background:#ffffff0d}
#cats button.sel{background:var(--accent);color:#111}
#cats .n,.sec h4 .n{color:var(--muted);font-size:12px;font-weight:700}
#cats button.sel .n{color:#111a}
.main{flex:1;overflow:auto;padding:4px 20px 24px;scroll-behavior:smooth}
.sec h4{font-size:15px;color:var(--text);margin:16px 0 10px;font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.gcard{position:relative;background:var(--panel2);border-radius:16px;padding:14px 8px 12px;text-align:center;cursor:pointer;border:2px solid transparent;transition:transform .1s,border-color .1s}
.gcard:hover,.gcard.sel{border-color:var(--accent);transform:translateY(-2px)}
.gcard .em{font-size:34px;line-height:1.1}
.gcard .nm{font-weight:800;font-size:14px;margin-top:6px}
.gcard .tags{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:7px}
.gcard .tags span{background:#ffffff10;color:var(--muted);border-radius:99px;padding:2px 7px;font-size:11px;font-weight:700}
.gcard .tags .t3d{background:#3fa9ff33;color:#8fd0ff}
.gcard .rec{color:var(--muted);font-size:11px;margin-top:6px;font-weight:600}
.gcard .fav{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;opacity:0;transition:opacity .1s}
.gcard:hover .fav,.gcard.sel .fav,.gcard .fav.on{opacity:1}.gcard .fav.on{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:17px}
.mfoot{padding:9px 20px;border-top:1px solid #ffffff10;color:var(--muted);font-size:12px;text-align:center}
#netBtn.live{background:#2ecc4033;color:#7dff9a}
#netView{position:fixed;inset:0;display:none;place-items:center;background:var(--bg)}
#netView.on{display:grid}
#netVideo{border-radius:16px;box-shadow:0 20px 60px #0008;background:#000;object-fit:contain;cursor:crosshair}
#online .card,#lobby .card{max-width:680px}
.bigcode{font-size:64px;font-weight:900;letter-spacing:10px;color:var(--accent);margin:4px 0 8px}
.mlist{display:flex;flex-direction:column;gap:6px;margin:16px 0;text-align:left}
.mrow{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 14px}
.mrow select{background:#34344c;color:var(--text);border:none;border-radius:8px;padding:6px 8px;font:600 14px inherit;font-family:inherit}
.netcols{display:flex;gap:14px;margin:16px 0}
.netbox{flex:1;background:var(--panel2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.netbox h3{color:var(--text);margin:0;font-size:18px}
.netbox .hint{margin:0;flex:1}
.netbox .big{font-size:17px;padding:11px}
.netin{width:100%;background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:10px 14px;color:var(--text);font:700 17px inherit;font-family:inherit;outline:none;user-select:text;margin-top:6px}
.netin:focus{border-color:var(--accent)}
.netbox .netin{background:#34344c;margin:0}
.netin.code{text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:24px}
.neterr{background:#ff4d4d22;color:#ff9a9a;border-radius:10px;padding:8px 12px;margin:10px 0}
.linkrow{display:flex;gap:8px}.linkrow input{flex:1;background:var(--panel2);border:none;border-radius:10px;padding:10px;color:var(--text);font:600 13px inherit;font-family:inherit;user-select:text}
.btnrow{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px}
body.mobile{touch-action:manipulation}
body.mobile #menu{display:none!important}
body.mobile #online .card,body.mobile #lobby .card,body.mobile #intro .card,body.mobile #result .card{width:96%;padding:18px;max-height:90vh}
body.mobile .netcols{flex-direction:column}
body.mobile .netbox.host{display:none}
body.mobile .desc{font-size:16px}
body.mobile h2{font-size:28px}
#pad{display:none}
body.mobile.guest #pad{display:block}
body.mobile.guest.pv #pad .dpad,body.mobile.guest.pv #pad .abtns{display:none}
#pad.hide .dpad,#pad.hide .abtns{display:none}
#pad button{touch-action:none;-webkit-user-select:none;user-select:none;border:2px solid #ffffff55;background:#ffffff22;color:#fff;font:800 20px inherit;font-family:inherit;border-radius:50%;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#pad button.on{background:#ffd23f99;border-color:#ffd23f}
.dpad{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:168px;height:168px;z-index:5}
.dpad button{position:absolute;width:58px;height:58px;border-radius:14px!important}
.dpad .u{left:55px;top:0}.dpad .d{left:55px;bottom:0}.dpad .l{left:0;top:55px}.dpad .r{right:0;top:55px}
.abtns{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:170px;height:150px;z-index:5}
.abtns button{position:absolute}
.abtns .a{width:78px;height:78px;right:0;top:20px;background:#ff4d6d66!important;font-size:26px}
.abtns .b{width:60px;height:60px;right:88px;top:58px;background:#3fa9ff55!important}
.abtns .ok{width:62px;height:38px;right:94px;top:0;border-radius:12px!important;font-size:14px}
#padToggle{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));width:42px;height:42px;font-size:18px!important;z-index:6}
.invite{display:flex;gap:16px;align-items:center;text-align:left;background:var(--panel2);border-radius:16px;padding:14px;margin:8px 0}
.invite .invl{flex:1;min-width:0}.invite .desc{margin:0 0 8px;font-size:16px}
.invite .linkrow input{background:#34344c}
.qr{width:150px;height:150px;flex-shrink:0;background:#fff;border-radius:12px;display:grid;place-items:center;overflow:hidden}
.qr img{width:100%;height:100%;image-rendering:pixelated}
.siteset{background:var(--panel2);border-radius:16px;padding:14px;margin:8px 0;text-align:left}
.siteset .desc{font-size:15px;margin:0 0 8px}.siteset .linkrow input{background:#34344c}
#onlineCard a{color:var(--accent)}
body.mobile .invite{flex-direction:column}
.netadv{margin-top:16px;text-align:left;background:var(--panel2);border-radius:14px;padding:10px 14px}
.netadv summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:14px}
.netadv .netin{background:#34344c;font-size:14px;padding:8px 12px}
.spin{width:38px;height:38px;border:4px solid #ffffff22;border-top-color:var(--accent);border-radius:50%;margin:14px auto 4px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gcard .em{width:68px;height:68px;margin:0 auto;font-size:40px;line-height:68px}
.gcard .em svg,.gicon svg,.rtag .mini svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 10px #0006)}
.gcard:hover .em svg,.gcard.sel .em svg{transform:scale(1.06) rotate(-3deg);transition:transform .15s}
.gicon{width:92px;height:92px;margin:0 auto 10px;font-size:64px;line-height:92px}
.rtag{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);color:var(--muted);border-radius:99px;padding:4px 14px 4px 4px;font-size:14px;margin-bottom:12px}
.rtag .mini{width:28px;height:28px;display:inline-block;line-height:28px}
.rtag .mini svg{filter:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c3d"></canvas><canvas id="c"></canvas></div>
<div id="netView"><video id="netVideo" playsinline autoplay></video></div>
<div id="pad"><div class="dpad"><button data-k="ArrowUp" class="u">▲</button><button data-k="ArrowLeft" class="l">◀</button><button data-k="ArrowRight" class="r">▶</button><button data-k="ArrowDown" class="d">▼</button></div>
  <div class="abtns"><button data-k="Space" class="ok">OK</button><button data-k="KeyE" class="b">B</button><button data-k="KeyF" class="a">A</button></div>
  <button id="padToggle" title="Afficher / masquer la manette">🎮</button></div>

<div id="menu" class="screen on"><div class="mwrap">
  <header class="mhead">
    <div class="logo">DUEL PARTY</div>
    <div class="tabs" id="tabs"><button data-t="duo">👥 À deux</button><button data-t="solo">👤 Solo</button></div>
    <div class="search"><input id="search" placeholder="🔍 Rechercher un jeu… (tape simplement au clavier)" autocomplete="off" spellcheck="false"></div>
    <button class="rand" id="netBtn">🌐 En ligne</button>
    <button class="rand" id="randBtn">🎲 Au hasard</button>
  </header>
  <div class="mbody">
    <aside class="side">
      <div id="sideDuo">
        <div class="sideTitle">Joueurs</div>
        <div class="pl p1"><input id="n1" maxlength="14"><small id="k1"></small></div>
        <div class="pl p2"><input id="n2" maxlength="14"><small id="k2"></small></div>
        <div class="sideTitle">Tournoi</div>
        <div class="tline">Premier à <span class="seg" id="targetSeg"><button data-v="3">3</button><button data-v="5">5</button><button data-v="7">7</button></span></div>
        <button class="big" id="tourBtn">🏆 Lancer le tournoi</button>
      </div>
      <div class="sideTitle">Catégories</div>
      <nav id="cats"></nav>
      <div class="sideTitle">Clavier</div>
      <div><span class="seg" id="layoutSeg"><button data-v="azerty">AZERTY</button><button data-v="qwerty">QWERTY</button></span></div>
    </aside>
    <main class="main" id="rows"></main>
  </div>
  <footer class="mfoot"><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> choisir · <kbd>Entrée</kbd> jouer · tape au clavier pour chercher · ☆ = favori · <kbd>Échap</kbd> revenir au menu</footer>
</div></div>

<div id="intro" class="screen"><div class="card" id="introCard"></div></div>
<div id="gui"><input id="gin" maxlength="90" autocomplete="off" spellcheck="false"><button id="gidea" title="Une idée au hasard">🎲</button><button id="gok">Valider ↵</button></div>
<div id="result" class="screen"><div class="card" id="resultCard"></div></div>
<div id="lobby" class="screen"><div class="card" id="lobbyCard"></div></div>
<div id="online" class="screen"><div class="card" id="onlineCard"></div></div>

<script>
// ---------- Configuration & état ----------
const W = 960, H = 600;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const P = [null,
  {name:'Rouge', color:'#ff4d6d', up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD'], act:['KeyF','ShiftLeft']},
  {name:'Bleu',  color:'#3fa9ff', up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'], act:['ShiftRight','Enter','NumpadEnter']},
  {name:'Vert',  color:'#2ecc71', up:['KeyI'], down:['KeyK'], left:['KeyJ'], right:['KeyL'], act:['KeyH']},
  {name:'Jaune', color:'#ffb020', up:['Numpad8'], down:['Numpad5'], left:['Numpad4'], right:['Numpad6'], act:['Numpad0']}];
let layout = 'azerty', target = 5, tab = 'duo', favs = [], recent = [];
try { const s = JSON.parse(localStorage.getItem('duelparty') || '{}');
  if (s.n1) P[1].name = s.n1; if (s.n2) P[2].name = s.n2;
  if (s.layout) layout = s.layout; if (s.target) target = s.target; if (s.tab) tab = s.tab; if (s.favs) favs = s.favs; if (s.recent) recent = s.recent; } catch (e) {}
function save(){ try { localStorage.setItem('duelparty', JSON.stringify({n1:P[1].name,n2:P[2].name,layout,target,tab,favs,recent})); } catch(e){} }

// ---------- Utilitaires ----------
const rand = (a,b) => a + Math.random()*(b-a);
const randi = n => Math.floor(Math.random()*n);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name = p => P[p].name;

function resize(){
  const s = Math.min(innerWidth/W, innerHeight/H) * 0.97, dpr = devicePixelRatio || 1;
  cv.style.width = W*s + 'px'; cv.style.height = H*s + 'px';
  cv.width = Math.round(W*s*dpr); cv.height = Math.round(H*s*dpr);
  ctx.setTransform(s*dpr, 0, 0, s*dpr, 0, 0);
  const c3 = document.getElementById('c3d'), d3 = Math.min(dpr, 2);
  c3.style.width = cv.style.width; c3.style.height = cv.style.height;
  const nv = document.getElementById('netVideo'); if (nv){ nv.style.width = cv.style.width; nv.style.height = cv.style.height; } c3.width = Math.round(W*s*d3); c3.height = Math.round(H*s*d3);
}
addEventListener('resize', () => { resize(); placeGui(); }); resize();

let AC;
function beep(f=440, d=.08, type='square', v=.04){
  try { AC = AC || new AudioContext();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
    o.connect(g).connect(AC.destination); if (NET.adest) g.connect(NET.adest); o.start(); o.stop(AC.currentTime + d);
  } catch(e){}
}

// ---------- Entrées clavier ----------
const down = new Set(), pressed = new Map(), typed = [];
var NET = {role:null, adest:null, mySlot:1};
const isDown = (p,k) => P[p][k].some(c => down.has(c));
const hit = (p,k) => P[p][k].some(c => pressed.has(c));
const act = p => hit(p,'act');
const pressTime = p => Math.min(...P[p].act.map(c => pressed.has(c) ? pressed.get(c) : Infinity));
function dirv(p){
  let x = (isDown(p,'right')?1:0) - (isDown(p,'left')?1:0), y = (isDown(p,'down')?1:0) - (isDown(p,'up')?1:0);
  const l = Math.hypot(x,y) || 1; return [x/l, y/l];
}
const keyCode = e => e.code || ({' ':'Space', Escape:'Escape', Enter:'Enter', ArrowUp:'ArrowUp', ArrowDown:'ArrowDown', ArrowLeft:'ArrowLeft', ArrowRight:'ArrowRight'})[e.key] || e.key;
const GAME_KEYS = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','Tab'];
addEventListener('keydown', e => {
  if (NET.role !== 'guest' && phase === 'menu' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT' && !$('online').classList.contains('on') && !e.metaKey && !e.ctrlKey && !e.altKey && e.key && e.key.length === 1 && /[\p{L}\p{N}\/]/u.test(e.key)){
    if (e.key === '/') e.preventDefault(); document.getElementById('search').focus(); return;
  }
  if (e.target.tagName === 'INPUT') { if (e.code === 'Enter' || e.code === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey) return;
  if (NET.role === 'guest') return;
  let code = keyCode(e);
  if (NET.role === 'host' && phase !== 'menu'){ code = netMap(code, NET.mySlot); if (!code) return; }
  if (GAME_KEYS.includes(code)) e.preventDefault();
  if (!e.repeat) pressed.set(code, performance.now());
  if (!e.repeat && e.key && e.key.length === 1) typed.push(e.key);
  down.add(code);
  if (!e.repeat) onKey(code);
});
addEventListener('keyup', e => { const c = keyCode(e); down.delete(c); if (NET.role === 'host'){ const m = netMap(c, NET.mySlot); if (m) down.delete(m); } });
addEventListener('blur', () => down.clear());

function lab(code){
  const az = layout === 'azerty';
  return ({KeyW:az?'Z':'W', KeyA:az?'Q':'A', KeyS:'S', KeyD:'D', KeyF:'F', KeyE:'E', KeyR:'R', Space:'Espace', ShiftLeft:'⇧ gauche', ShiftRight:'⇧ droit',
    Enter:'Entrée', ArrowUp:'↑', ArrowDown:'↓', ArrowLeft:'←', ArrowRight:'→'})[code] || code;
}
const kb = c => `<kbd>${lab(c)}</kbd>`;
const keysHtml = (p, list) => list.map(k => P[p][k].slice(0, k === 'act' ? 2 : 1).map(kb).join(' ou ')).join(' ');
const MOVE = ['up','left','down','right'];

const FONT = '-apple-system,"SF Pro Rounded",system-ui,sans-serif';
function clear(c='#0b0b14'){ ctx.fillStyle = c; ctx.fillRect(0,0,W,H); }
function txt(s,x,y,size=32,col='#fff',align='center',weight=800){
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s,x,y);
}
function circ(x,y,r,col){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle = col; ctx.fill(); }
function rrect(x,y,w,h,r,col){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fillStyle = col; ctx.fill(); }
function hud(a,b,label=''){
  txt(a, 50, 38, 40, P[1].color); txt(name(1), 50, 70, 14, P[1].color, 'center', 600);
  txt(b, W-50, 38, 40, P[2].color); txt(name(2), W-50, 70, 14, P[2].color, 'center', 600);
  if (label) txt(label, W/2, 28, 16, '#9a9ab0', 'center', 600);
}

// Joueurs actifs : en ligne, les places attribuées dans le salon ; sinon les 2 joueurs du clavier
function players(){
  if (NET.role === 'host'){ const s = [...new Set(NET.members.map(m => m.slot).filter(Boolean))].sort(); if (s.length >= 2) return s; }
  return [1,2];
}
const scoreLine = (PL, sc) => PL.map(p => `${name(p)} ${sc[p]}`).join(' · ');
function hudN(PL, val, label = ''){
  if (PL.length === 2 && PL[0] === 1 && PL[1] === 2) return hud(val(1), val(2), label);
  PL.forEach((p, i) => { const x = W*(i + .5)/PL.length; txt(val(p), x, 34, 32, P[p].color); txt(name(p), x, 62, 13, P[p].color, 'center', 600); });
  if (label) txt(label, W/2, 84, 13, '#9a9ab0', 'center', 600);
}

const CN = {CW:172, CH:84, GAP:10, X0:(W - (5*172 + 4*10))/2, Y0:120, BTN:{x:790, y:30, w:150, h:48}};
function cnCellAt(x, y){
  const c = Math.floor((x - CN.X0)/(CN.CW + CN.GAP)), r = Math.floor((y - CN.Y0)/(CN.CH + CN.GAP));
  if (c < 0 || c > 4 || r < 0 || r > 4) return -1;
  if (x - CN.X0 - c*(CN.CW + CN.GAP) > CN.CW || y - CN.Y0 - r*(CN.CH + CN.GAP) > CN.CH) return -1;
  return r*5 + c;
}
function cnDraw(S, me){
  clear('#1a1a2a');
  const g = S.giver, o = 3 - g, nm = p => S.names[p];
  if (S.st === 'handClue' || S.st === 'handGuess'){
    const clue = S.st === 'handClue', who = clue ? g : o;
    txt(`⏳ ${S.tokens} tour(s) restant(s) · 🕵️ ${S.nf} / 15 agents`, W/2, 120, 20, '#9a9ab0', 'center', 600);
    txt(clue ? `${nm(g)} donne un indice` : `${nm(o)}, à toi de deviner !`, W/2, 220, 54, P[who].color);
    txt(clue ? `${nm(o)}, ne regarde pas l'écran ! 🙈` : `(${nm(g)} peut regarder aussi)`, W/2, 320, 26, P[clue ? o : g].color, 'center', 700);
    txt('Espace quand vous êtes prêts', W/2, 460, 20, '#9a9ab0', 'center', 600);
    return;
  }
  for (let i = 0; i < 25; i++){
    const x = CN.X0 + (i % 5)*(CN.CW + CN.GAP), y = CN.Y0 + Math.floor(i/5)*(CN.CH + CN.GAP), k = S.kv ? S.kv[i] : null;
    let bg = '#eee4cc', fg = '#1a1a1a';
    if (S.found[i]){ bg = '#2ecc71'; fg = '#fff'; }
    else if (k === 'g'){ bg = '#1f7a4a'; fg = '#fff'; }
    else if (k === 'a'){ bg = '#111'; fg = '#fff'; }
    else if (k === 'n' || (S.byst[1][i] && S.byst[2][i])) bg = '#b9b19c';
    if (S.boom === i) bg = '#c0392b';
    rrect(x, y, CN.CW, CN.CH, 10, bg);
    if (k === 'a' || S.boom === i) txt('💀', x + 18, y + 18, 16);
    if (S.found[i]) txt('✓', x + CN.CW - 16, y + 16, 18, '#fff');
    for (const s of [1,2]) if (S.byst[s][i]) circ(x + (s === 1 ? 14 : CN.CW - 14), y + CN.CH - 14, 6, P[s].color);
    fitTxt(S.words[i], x + CN.CW/2, y + CN.CH/2 + 2, CN.CW - 20, 22, fg, 800);
  }
  const mine = me === null || me === undefined;
  if (S.st === 'clue'){
    if (mine || me === g) txt(`🔒 ${mine ? 'Carte secrète de ' + nm(g) : 'Ta carte secrète'} : 🟩 agent · ⬛ assassin · beige = neutre`, W/2, 24, 18, P[g].color, 'center', 700);
    else { txt(`⏳ ${nm(g)} prépare un indice…`, W/2, 40, 28, P[g].color); txt(me ? '🔒 Ta carte secrète est affichée (vert = tes agents)' : '', W/2, 84, 15, '#9a9ab0', 'center', 600); }
    return;
  }
  fitTxt(`Indice de ${nm(g)} : « ${S.clue} »`, 400, 36, 740, 28, P[g].color);
  const myTurn = mine || me === o;
  txt(`🕵️ ${S.nf} / 15 agents · ⏳ ${S.tokens} tour(s) · ${myTurn && !mine ? 'à toi de cliquer sur les mots !' : nm(o) + ' clique sur les mots'}`, 400, 84, 16, '#9a9ab0', 'center', 600);
  if (S.st === 'guess' && myTurn){ rrect(CN.BTN.x, CN.BTN.y, CN.BTN.w, CN.BTN.h, 12, '#ffd23f'); txt('✋ Fin du tour', CN.BTN.x + CN.BTN.w/2, CN.BTN.y + CN.BTN.h/2, 18, '#111'); }
  if (S.st === 'after' || S.st === 'over'){ rrect(W/2 - 330, H/2 - 40, 660, 80, 16, '#000d'); fitTxt(S.msg, W/2, H/2, 620, 28, '#ffd23f'); }
}

{
  id:'tron', emoji:'🏍️', name:'Motos de lumière', maxP:4,
  desc:'Votre moto laisse un mur derrière elle. Ne touchez ni les murs ni les traînées ! Le dernier en vie gagne la manche. Premier à 2 manches.',
  ctrl:[[MOVE,'Tourner']],
  make(){
    const PL = players(), DIRS = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]}, C = 80, R = 50, S = 12;
    const START = {1:[15,25,[1,0]], 2:[64,25,[-1,0]], 3:[40,6,[0,1]], 4:[40,43,[0,-1]]};
    const g = {
      sc:[0,0,0,0,0], pause:0, msg:'',
      reset(){
        this.grid = new Uint8Array(C*R); this.pl = []; this.acc = 0;
        for (const p of PL){ const [x, y, d] = START[p]; this.pl[p] = {x, y, d, q:[], alive:true}; this.grid[y*C + x] = p; }
      },
      update(dt){
        if (this.pause > 0){
          this.pause -= dt;
          if (this.pause <= 0){ const w = PL.find(p => this.sc[p] >= 2); if (w){ this.winner = w; this.res = scoreLine(PL, this.sc); } else this.reset(); }
          return;
        }
        for (const p of PL) for (const k in DIRS) if (hit(p,k) && this.pl[p].q.length < 3) this.pl[p].q.push(DIRS[k]);
        this.acc += dt;
        while (this.acc >= .055 && this.pause <= 0){ this.acc -= .055; this.step(); }
      },
      step(){
        const alive = PL.filter(p => this.pl[p].alive), heads = {};
        for (const p of alive){
          const pl = this.pl[p];
          while (pl.q.length){
            const nd = pl.q.shift();
            if ((nd[0] !== -pl.d[0] || nd[1] !== -pl.d[1]) && (nd[0] !== pl.d[0] || nd[1] !== pl.d[1])){ pl.d = nd; break; }
          }
          heads[p] = [pl.x + pl.d[0], pl.y + pl.d[1]];
        }
        const dead = new Set();
        for (const p of alive){
          const [x, y] = heads[p];
          if (x < 0 || y < 0 || x >= C || y >= R || this.grid[y*C + x]) dead.add(p);
          for (const q of alive) if (q !== p && heads[q][0] === x && heads[q][1] === y) dead.add(p);
        }
        for (const p of alive){ if (dead.has(p)) this.pl[p].alive = false; else { const [x, y] = heads[p]; this.pl[p].x = x; this.pl[p].y = y; this.grid[y*C + x] = p; } }
        if (dead.size) beep(110, .3, 'sawtooth');
        const left = PL.filter(p => this.pl[p].alive);
        if (left.length <= 1){
          this.pause = 1.8;
          if (left.length === 1){ this.sc[left[0]]++; this.msg = `${name(left[0])} gagne la manche !`; } else this.msg = 'Crash général ! Manche nulle';
        }
      },
      draw(){
        clear('#070712'); ctx.fillStyle = '#ffffff08';
        for (let x = 0; x < W; x += S) ctx.fillRect(x, 0, 1, H); for (let y = 0; y < H; y += S) ctx.fillRect(0, y, W, 1);
        for (let i = 0; i < C*R; i++) if (this.grid[i]){ ctx.fillStyle = P[this.grid[i]].color + 'bb'; ctx.fillRect((i % C)*S, Math.floor(i/C)*S, S, S); }
        for (const p of PL){ const pl = this.pl[p]; if (pl.alive){ ctx.fillStyle = '#fff'; ctx.fillRect(pl.x*S + 2, pl.y*S + 2, S - 4, S - 4); } }
        hudN(PL, p => this.sc[p], 'Premier à 2 manches');
        if (this.pause > 0){ rrect(W/2 - 280, H/2 - 40, 560, 80, 16, '#000c'); txt(this.msg, W/2, H/2, 32, '#ffd23f'); }
      }
    };
    g.reset(); return g;
  }
},

        if (foul){ say(cueIn ? 'Blanche rentrée : faute !' : this.first === null ? 'Aucune boule touchée : faute !' : 'Mauvaise boule touchée : faute !'); this.turn = o; beep(120, .2, 'sawtooth'); }
        else if (mine) say('Bien joué, rejoue !');
        else this.turn = o;
        this.st = 'aim'; this.aimAt(this.turn);
      },
      draw(){
        clear('#141420');
        rrect(L - 36, T - 36, R - L + 72, B - T + 72, 26, '#6b3f1f');
        rrect(L - 18, T - 18, R - L + 36, B - T + 36, 12, '#135c38');
        ctx.fillStyle = '#1e7a4c'; ctx.fillRect(L, T, R - L, B - T);
        ctx.fillStyle = '#ffffff18'; ctx.fillRect(300, T, 2, B - T); circ(300, MY, 3, '#ffffff40');
        for (const [px,py] of PK) circ(px, py, 19, '#050505');
        if (this.st === 'aim'){
          const c = this.cue, dx = Math.cos(this.aim), dy = Math.sin(this.aim);
          let tMin = Infinity, ghost = null;
          for (const b of this.balls) if (b.in && b !== c){
            const mx = b.x - c.x, my = b.y - c.y, t = mx*dx + my*dy, pp = mx*mx + my*my - t*t;
            if (t > 0 && pp < 4*r*r){ const th = t - Math.sqrt(4*r*r - pp); if (th < tMin){ tMin = th; ghost = b; } }
          }
          const tw = Math.min(dx > 0 ? (R - r - c.x)/dx : dx < 0 ? (L + r - c.x)/dx : Infinity, dy > 0 ? (B - r - c.y)/dy : dy < 0 ? (T + r - c.y)/dy : Infinity);
          const tt = Math.min(tMin, tw), gx = c.x + dx*tt, gy = c.y + dy*tt;
          ctx.save(); ctx.lineCap = 'round';
          ctx.setLineDash([6,6]); ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(gx, gy); ctx.stroke(); ctx.setLineDash([]);
          ctx.beginPath(); ctx.arc(gx, gy, r, 0, Math.PI*2); ctx.strokeStyle = '#ffffffcc'; ctx.stroke();
          if (ghost && tMin <= tw){
            const nx = (ghost.x - gx)/(2*r), ny = (ghost.y - gy)/(2*r);
            ctx.strokeStyle = '#ffd23faa'; ctx.beginPath(); ctx.moveTo(ghost.x, ghost.y); ctx.lineTo(ghost.x + nx*60, ghost.y + ny*60); ctx.stroke();
          }
          const back = 18 + this.pow*70;
          ctx.strokeStyle = '#d9b27c'; ctx.lineWidth = 7; ctx.beginPath();
          ctx.moveTo(c.x - dx*back, c.y - dy*back); ctx.lineTo(c.x - dx*(back + 280), c.y - dy*(back + 280)); ctx.stroke();
          ctx.strokeStyle = '#3a2412'; ctx.beginPath(); ctx.moveTo(c.x - dx*(back + 200), c.y - dy*(back + 200)); ctx.lineTo(c.x - dx*(back + 280), c.y - dy*(back + 280)); ctx.stroke();
          ctx.restore();
        }
        for (const b of this.balls) if (b.in){
          circ(b.x + 2, b.y + 3, r, '#0005');
          circ(b.x, b.y, r, b.c === 0 ? '#f5f5f0' : b.c === 3 ? '#111' : P[b.c].color);
          if (b.c === 3){ circ(b.x, b.y, 5.5, '#fff'); txt('8', b.x, b.y + .5, 8, '#111', 'center', 900); }
          circ(b.x - 3.5, b.y - 3.5, 3.5, '#ffffff77');
        }
        for (const p of [1,2]){
          const x = p === 1 ? L - 30 : R + 30, al = p === 1 ? 'left' : 'right', n = this.left(p);
          txt(name(p), x, 38, 22, P[p].color, al);
          if (n) for (let i = 0; i < n; i++) circ(x + (p === 1 ? 8 + i*20 : -8 - i*20), 72, 7, P[p].color);
          else txt('→ la noire !', x, 72, 16, '#fff', al, 700);
        }
        txt(`Au tour de ${name(this.turn)}`, W/2, 38, 26, P[this.turn].color);
        if (this.msgT > 0) txt(this.msg, W/2, 74, 20, '#ffd23f', 'center', 700);
        rrect(904, T, 16, B - T, 8, '#26263a');
        if (this.pow > 0) rrect(904, B - this.pow*(B - T), 16, this.pow*(B - T), 8, P[this.turn].color);
        txt('⚡', 912, B + 22, 18);
        if (this.st === 'over'){ rrect(W/2 - 300, H/2 - 45, 600, 90, 18, '#000d'); txt(this.msg, W/2, H/2, 30, '#ffd23f'); }
      }
    };
    g.aimAt(g.turn); return g;
  }
},
{

{
  id:'codenames', emoji:'🕵️', name:'Code Names Duo', noTour:true,
  desc:"Version <b>coopérative</b> à deux : trouvez ensemble les <b>15 agents</b> cachés parmi 25 mots, en <b>9 tours</b> maximum. Chacun a sa propre carte secrète. À tour de rôle, l'un donne un indice (<i>un mot + un nombre</i>) et l'autre clique sur les mots. Un mot neutre termine le tour… et un <b>assassin</b> 💀 fait tout perdre !",
  note:() => NET.role === 'host' ? "🌐 <b>En ligne : chacun voit sa propre carte secrète sur son écran</b> (ordi ou téléphone). Pas besoin de se cacher !" : "🖱️ On clique sur les mots, on tape l'indice au clavier.<br>🙈 Quand l'autre regarde sa carte secrète, <b>ne regarde pas l'écran</b> !<br>💡 En ligne (🌐), chacun a sa carte sur son propre écran — même sur téléphone.",
  drawPrivate:(S, me) => cnDraw(S, me),
  pvGui:(S, me) => S.st === 'clue' && S.giver === me ? 'Ton indice : un mot + un nombre (ex : animal 3)' : null,
  make(){
    const words = shuffle(CN_WORDS).slice(0, 25), idx = shuffle([...Array(25).keys()]);
    const k1 = Array(25).fill('n'), k2 = Array(25).fill('n');
    const put = (n, a, b) => { for (let j = 0; j < n; j++){ const i = idx.pop(); k1[i] = a; k2[i] = b; } };
    put(3,'g','g'); put(5,'g','n'); put(1,'g','a'); put(5,'n','g'); put(1,'a','g'); put(1,'a','a'); put(1,'a','n'); put(1,'n','a');
    const key = [null, k1, k2], online = NET.role === 'host';
    return {
      turnSlot(){ return this.st === 'guess' ? this.guesser : this.giver; }, words, key, online, found:Array(25).fill(false), byst:[null, Array(25).fill(false), Array(25).fill(false)],
      giver:randi(2)+1, st:'handClue', tokens:9, clue:'', msg:'', t:0, boom:-1,
      get guesser(){ return 3 - this.giver; },
      nFound(){ return this.found.filter(Boolean).length; },
      left(s){ return this.key[s].filter((k,i) => k === 'g' && !this.found[i]).length; },
      // Ce que voit le joueur `me` (null = écran partagé) : les cartes secrètes ne sortent que vers leur propriétaire
      netState(me){
        const all = this.words.map((_, i) => k1[i] === 'g' || k2[i] === 'g' ? 'g' : k1[i] === 'a' || k2[i] === 'a' ? 'a' : 'n');
        const kv = this.st === 'over' ? all : me ? this.key[me] : me === null && this.st === 'clue' ? this.key[this.giver] : null;
        return {words:this.words, found:this.found, byst:this.byst, giver:this.giver, st:this.st, clue:this.clue, tokens:this.tokens, msg:this.msg, boom:this.boom,
          nf:this.nFound(), kv, online:this.online, names:[null, name(1), name(2)]};
      },
      setClue(t){ this.clue = String(t).trim() || '(pas d\'indice)'; gui.close(); this.st = this.online ? 'guess' : 'handGuess'; },
      netText(v, slot){ if (this.st === 'clue' && slot === this.giver) this.setClue(v); },
      finish(ok, m){ this.st = 'over'; this.t = 3.5; this.msg = m; this.resTitle = ok ? '🕵️ Mission réussie !' : '💀 Mission échouée…'; this.res = m; beep(ok ? 880 : 90, .5, ok ? 'triangle' : 'sawtooth'); },
      endTurn(m){
        this.tokens--;
        if (this.tokens <= 0) return this.finish(false, `Plus de tours… ${this.nFound()} agents sur 15 trouvés.`);
        this.st = 'after'; this.t = 1.6; this.msg = m;
      },
      cleanup(){ gui.close(); },
      update(dt){
        if (this.st === 'handClue' && (this.online || pressed.has('Space'))){
          this.st = 'clue';
          if (!this.online || this.giver === NET.mySlot) gui.open('Ton indice : un mot + un nombre (ex : animal 3)', false, t => this.setClue(t), 72, false, true);
        } else if (this.st === 'handGuess' && pressed.has('Space')) this.st = 'guess';
        else if (this.st === 'after'){
          this.t -= dt;
          if (this.t <= 0){ const o = this.guesser; if (this.left(o) > 0) this.giver = o; this.st = 'handClue'; }
        } else if (this.st === 'over'){ this.t -= dt; if (this.t <= 0) this.winner = 0; }
      },
      mouse(type, x, y){
        if (type !== 'down' || this.st !== 'guess') return;
        if (inBtn(CN.BTN, x, y)){ beep(400, .05); return this.endTurn('Fin du tour.'); }
        const i = cnCellAt(x, y);
        if (i < 0 || this.found[i] || this.byst[this.giver][i]) return;
        const k = this.key[this.giver][i];
        if (k === 'g'){
          this.found[i] = true; beep(880, .1);
          if (this.nFound() >= 15) this.finish(true, `Les 15 agents trouvés avec ${this.tokens - 1} tour(s) d'avance !`);
        } else if (k === 'n'){ this.byst[this.giver][i] = true; beep(200, .15, 'triangle'); this.endTurn(`« ${this.words[i]} » est neutre. Fin du tour !`); }
        else { this.boom = i; this.finish(false, `« ${this.words[i]} » était un assassin !`); }
      },
      draw(){ const me = this.online ? NET.mySlot : null; cnDraw(this.netState(me), me); }
    };
  }
},

{
  id:'snake', solo:true, emoji:'🐍', name:'Snake',
  desc:'Mangez les pommes pour grandir, sans vous mordre la queue ni toucher les murs. Ça accélère à chaque pomme !',
  note:() => `${soloMove()} pour diriger le serpent.`,
  make(){
    const C = 32, R = 20, S = 30, DIRS = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};
    const g = {
      sn:[[8,10],[7,10],[6,10]], d:[1,0], q:[], sc:0, acc:0, speed:.12, dead:false,
      place(){ let f; do f = [randi(C), randi(R)]; while (this.sn.some(s => s[0] === f[0] && s[1] === f[1])); this.food = f; },
      update(dt){
        if (this.dead){ this.t -= dt; if (this.t <= 0) finishSolo(this, 'snake', this.sc, `🍎 ${this.sc} pomme(s)`); return; }
        for (const k in DIRS) if (sHit(k) && this.q.length < 3) this.q.push(DIRS[k]);
        this.acc += dt;
        while (this.acc >= this.speed && !this.dead){ this.acc -= this.speed; this.step(); }
      },
      step(){
        while (this.q.length){ const nd = this.q.shift(); if ((nd[0] !== -this.d[0] || nd[1] !== -this.d[1]) && (nd[0] !== this.d[0] || nd[1] !== this.d[1])){ this.d = nd; break; } }
        const h = [this.sn[0][0] + this.d[0], this.sn[0][1] + this.d[1]];
        const eat = h[0] === this.food[0] && h[1] === this.food[1];
        const body = eat ? this.sn : this.sn.slice(0, -1);
        if (h[0] < 0 || h[1] < 0 || h[0] >= C || h[1] >= R || body.some(s => s[0] === h[0] && s[1] === h[1])){ this.dead = true; this.t = 1.2; beep(90, .4, 'sawtooth'); return; }
        this.sn.unshift(h);
        if (eat){ this.sc++; this.speed = Math.max(.055, this.speed * .97); this.place(); beep(880, .05); } else this.sn.pop();
      },
      draw(){
        clear('#0f1a12');
        ctx.fillStyle = '#ffffff06'; for (let x = 0; x < C; x++) for (let y = 0; y < R; y++) if ((x + y) % 2) ctx.fillRect(x*S, y*S, S, S);
        circ(this.food[0]*S + S/2, this.food[1]*S + S/2, S/2 - 4, '#ff4d4d'); ctx.fillStyle = '#2ecc40'; ctx.fillRect(this.food[0]*S + S/2 - 1, this.food[1]*S + 3, 3, 6);
        this.sn.forEach((s,i) => rrect(s[0]*S + 2, s[1]*S + 2, S - 4, S - 4, 7, i === 0 ? (this.dead ? '#c0392b' : '#7dff9a') : `hsl(${140 - Math.min(i, 30)}, 70%, ${50 - Math.min(i, 20)}%)`));
        txt(`🍎 ${this.sc}`, 20, 26, 24, '#fff', 'left'); txt(recText('snake'), W - 20, 26, 16, '#9a9ab0', 'right', 600);
      }
    };
    g.place(); return g;
  }
},
{

// ---------- Outils solo ----------
const sDown = k => isDown(1,k) || isDown(2,k);
const sHit = k => hit(1,k) || hit(2,k);
const sAct = () => act(1) || act(2) || pressed.has('Space');
const soloKeys = ks => keysHtml(2, ks) + ' ou ' + keysHtml(1, ks);
const soloMove = () => soloKeys(MOVE);
let records = {};
try { records = JSON.parse(localStorage.getItem('duelparty-rec') || '{}'); } catch (e) {}
function saveRecords(){ try { localStorage.setItem('duelparty-rec', JSON.stringify(records)); } catch (e) {} }
function recText(id){
  if (id === 'sudoku') return ['F','M','D'].map((n,k) => `${n} ${records['sudoku-' + k] !== undefined ? mmss(records['sudoku-' + k]) : '–'}`).join(' · ');
  const d = GAMES.find(g => g.id === id), v = records[id];
  if (v === undefined) return d.recWins ? 'Victoires : 0' : 'Pas encore de record';
  return (d.recWins ? 'Victoires : ' : 'Record : ') + v + (d.recUnit || '');
}
function finishSolo(g, id, score, label, lower=false){
  const old = records[id], isNew = (lower ? old === undefined || score < old : score > 0 && (old === undefined || score > old));
  if (isNew){ records[id] = score; saveRecords(); }
  g.resTitle = isNew ? '🎉 Nouveau record !' : '🏁 Partie terminée';
  g.res = `${label} · ${recText(id)}`; g.winner = 0;
}

// ---------- Morpion ----------
function makeMorpion(ai){
  const S = 140, X0 = (W - 3*S)/2, Y0 = 130;
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const winOf = b => { for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return {p:b[l[0]], l}; return b.every(Boolean) ? {p:0} : null; };
  const nm = p => ai && p === 2 ? 'Ordi 🤖' : ai ? 'Toi' : name(p);
  const g = {
    turnSlot(){ return ai ? 1 : this.turn; }, sc:[0,0,0], round:0, starter:randi(2) + 1, c:4,
    reset(){ this.b = Array(9).fill(0); this.turn = this.starter; this.starter = 3 - this.starter; this.st = 'play'; this.round++; this.aiT = .7; this.line = null; },
    place(i){
      if (this.st !== 'play' || this.b[i]) return;
      this.b[i] = this.turn; beep(this.turn === 1 ? 500 : 650, .06);
      const w = winOf(this.b);
      if (w){ this.st = 'end'; this.t = 1.8; this.line = w.l; if (w.p) this.sc[w.p]++; this.msg = w.p ? `${nm(w.p)} ${ai && w.p === 1 ? 'gagnes' : 'gagne'} la manche !` : 'Match nul !'; }
      else { this.turn = 3 - this.turn; this.aiT = .7; }
    },
    aiMove(){
      const b = this.b, free = [...Array(9).keys()].filter(i => !b[i]);
      if (Math.random() < .2) return free[randi(free.length)];
      const mm = t => { const w = winOf(b); if (w) return w.p === 2 ? 1 : w.p === 1 ? -1 : 0; let best = t === 2 ? -2 : 2;
        for (let i = 0; i < 9; i++) if (!b[i]){ b[i] = t; const v = mm(3 - t); b[i] = 0; best = t === 2 ? Math.max(best, v) : Math.min(best, v); } return best; };
      let bi = free[0], bv = -3;
      for (const i of shuffle(free)){ b[i] = 2; const v = mm(1); b[i] = 0; if (v > bv){ bv = v; bi = i; } }
      return bi;
    },
    update(dt){
      if (this.st === 'end'){
        this.t -= dt;
        if (this.t <= 0){
          if (this.sc[1] >= 2 || this.sc[2] >= 2 || this.round >= 5){
            const w = this.sc[1] > this.sc[2] ? 1 : this.sc[2] > this.sc[1] ? 2 : 0;
            this.res = `${nm(1)} ${this.sc[1]} – ${this.sc[2]} ${nm(2)}`;
            if (ai){ endVsAi(this, 'morpion-ia', w); } else this.winner = w;
          } else this.reset();
        }
        return;
      }
      const p = this.turn;
      if (ai && p === 2){ this.aiT -= dt; if (this.aiT <= 0) this.place(this.aiMove()); return; }
      for (const q of ai ? [1,2] : [p]){
        if (hit(q,'left') && this.c % 3 > 0) this.c--; if (hit(q,'right') && this.c % 3 < 2) this.c++;
        if (hit(q,'up') && this.c > 2) this.c -= 3; if (hit(q,'down') && this.c < 6) this.c += 3;
        if (act(q)) this.place(this.c);
      }
      if (ai && pressed.has('Space')) this.place(this.c);
    },
    mouse(type, x, y){
      const c = Math.floor((x - X0)/S), r = Math.floor((y - Y0)/S);
      if (c < 0 || c > 2 || r < 0 || r > 2) return;
      if (type === 'move'){ this.c = r*3 + c; return; }
      if (type === 'down' && !(ai && this.turn === 2)){ this.c = r*3 + c; this.place(this.c); }
    },
    draw(){
      clear();
      txt(nm(1), 90, 40, 22, P[1].color); txt(this.sc[1], 90, 80, 44, P[1].color);

const P4L = (() => { const out = []; for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) for (const [dc,dr] of [[1,0],[0,1],[1,1],[1,-1]]){ const ce = c + 3*dc, re = r + 3*dr; if (ce < 7 && re >= 0 && re < 6) out.push([0,1,2,3].map(k => (r + k*dr)*7 + c + k*dc)); } return out; })();
function p4Win(b){ for (const l of P4L){ const v = b[l[0]]; if (v && v === b[l[1]] && v === b[l[2]] && v === b[l[3]]) return {p:v, l}; } return null; }
function p4Drop(b, c){ for (let r = 5; r >= 0; r--) if (!b[r*7 + c]) return r*7 + c; return -1; }
function p4Eval(b, p){
  const o = 3 - p; let s = 0;
  for (let r = 0; r < 6; r++){ if (b[r*7 + 3] === p) s += 3; else if (b[r*7 + 3] === o) s -= 3; }
  for (const l of P4L){
    let a = 0, z = 0; for (const i of l){ if (b[i] === p) a++; else if (b[i] === o) z++; }
    if (a && z) continue;
    if (a === 3) s += 6; else if (a === 2) s += 2;
    if (z === 3) s -= 7; else if (z === 2) s -= 2;
  }
  return s;
}
function p4AI(b0, p, depth = 5){
  const b = b0.slice(), ORDER = [3,2,4,1,5,0,6];
  const neg = (d, a, be, t) => {
    let best = -Infinity, any = false;
    for (const c of ORDER){
      const i = p4Drop(b, c); if (i < 0) continue; any = true; b[i] = t;
      const v = p4Win(b) ? 1e6 + d : d === 0 ? p4Eval(b, t) : -neg(d - 1, -be, -a, 3 - t);
      b[i] = 0; if (v > best) best = v; if (best > a) a = best; if (a >= be) break;
    }
    return any ? best : 0;
  };
  let bestC = 3, bv = -Infinity;
  for (const c of ORDER){
    const i = p4Drop(b, c); if (i < 0) continue; b[i] = p;
    const v = (p4Win(b) ? 1e7 : -neg(depth - 1, -Infinity, Infinity, 3 - p)) + Math.random();
    b[i] = 0; if (v > bv){ bv = v; bestC = c; }
  }
  return bestC;
}

function makeAirHockey(){
  const L = 20, R = W - 20, T = 70, B = 585, MY = (T + B)/2, G1 = MY - 75, G2 = MY + 75, MR = 30, PR = 18;
  const g = {
    sc:[0,0,0], pause:.6, msg:'', msgT:0,
    m:[null, {x:150, y:MY, vx:0, vy:0}, {x:W - 150, y:MY, vx:0, vy:0}],
    serve(side){ this.pk = {x:side === 1 ? W/2 - 110 : W/2 + 110, y:MY, vx:0, vy:0}; },
    update(dt){
      this.msgT -= dt;
      for (const p of [1,2]){
        const m = this.m[p], [dx,dy] = dirv(p), ox = m.x, oy = m.y;
        m.x = clamp(m.x + dx*580*dt, p === 1 ? L + MR : W/2 + MR, p === 1 ? W/2 - MR : R - MR);
        m.y = clamp(m.y + dy*580*dt, T + MR, B - MR);
        m.vx = dt > 0 ? (m.x - ox)/dt : 0; m.vy = dt > 0 ? (m.y - oy)/dt : 0;
      }
      if (this.pause > 0){ this.pause -= dt; return; }
      const N = 6, sd = dt/N, pk = this.pk;
      for (let n = 0; n < N; n++){
        pk.x += pk.vx*sd; pk.y += pk.vy*sd;
        if (pk.y < T + PR){ pk.y = T + PR; pk.vy = Math.abs(pk.vy)*.92; beep(300, .02); }
        if (pk.y > B - PR){ pk.y = B - PR; pk.vy = -Math.abs(pk.vy)*.92; beep(300, .02); }
        const mouth = pk.y > G1 + 4 && pk.y < G2 - 4;
        if (pk.x < L + PR && !mouth){ pk.x = L + PR; pk.vx = Math.abs(pk.vx)*.92; beep(300, .02); }
        if (pk.x > R - PR && !mouth){ pk.x = R - PR; pk.vx = -Math.abs(pk.vx)*.92; beep(300, .02); }
        if (pk.x < L - PR || pk.x > R + PR){
          const w = pk.x < L ? 2 : 1; this.sc[w]++; beep(220, .3, 'triangle'); beep(660, .3, 'triangle');
          this.msg = `But de ${name(w)} !`; this.msgT = 1.2;
          if (this.sc[w] >= 7){ this.winner = w; return; }
          this.serve(3 - w); this.pause = 1.1; return;
        }
        for (const p of [1,2]){
          const m = this.m[p], dx = pk.x - m.x, dy = pk.y - m.y, d = Math.hypot(dx, dy);
          if (d < MR + PR && d > 0){
            const nx = dx/d, ny = dy/d; pk.x = m.x + nx*(MR + PR); pk.y = m.y + ny*(MR + PR);
            const rel = (pk.vx - m.vx)*nx + (pk.vy - m.vy)*ny;
            if (rel < 0){ pk.vx -= 1.9*rel*nx; pk.vy -= 1.9*rel*ny; beep(520, .03); }
          }
        }
      }
      const s = Math.hypot(pk.vx, pk.vy); if (s > 1300){ pk.vx *= 1300/s; pk.vy *= 1300/s; }
      const f = Math.exp(-.3*dt); pk.vx *= f; pk.vy *= f;
    },
    draw(){
      clear('#101826');
      rrect(L - 10, T - 10, R - L + 20, B - T + 20, 26, '#2b3a55');
      rrect(L, T, R - L, B - T, 18, '#e9f4fb');
      ctx.fillStyle = P[1].color; ctx.fillRect(L - 14, G1, 14, G2 - G1); ctx.fillStyle = P[2].color; ctx.fillRect(R, G1, 14, G2 - G1);
      ctx.strokeStyle = '#ff4d6d66'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(W/2, T); ctx.lineTo(W/2, B); ctx.stroke();
      ctx.strokeStyle = '#3fa9ff55'; ctx.beginPath(); ctx.arc(W/2, MY, 70, 0, Math.PI*2); ctx.stroke();
      for (const [x, a0, a1] of [[L, -Math.PI/2, Math.PI/2], [R, Math.PI/2, Math.PI*1.5]]){ ctx.beginPath(); ctx.arc(x, MY, 90, a0, a1); ctx.strokeStyle = '#99999955'; ctx.stroke(); }
      circ(this.pk.x + 3, this.pk.y + 4, PR, '#0003'); circ(this.pk.x, this.pk.y, PR, '#1a1a1a'); circ(this.pk.x, this.pk.y, PR - 6, '#333');
      for (const p of [1,2]){ const m = this.m[p]; circ(m.x + 3, m.y + 5, MR, '#0003'); circ(m.x, m.y, MR, P[p].color); circ(m.x, m.y, MR - 10, '#ffffff55'); circ(m.x, m.y, 10, P[p].color); }
      txt(this.sc[1], W/2 - 60, 36, 40, P[1].color); txt(this.sc[2], W/2 + 60, 36, 40, P[2].color);
      txt(name(1), 30, 36, 18, P[1].color, 'left'); txt(name(2), W - 30, 36, 18, P[2].color, 'right'); txt('Premier à 7', W/2, 36, 14, '#9a9ab0', 'center', 600);
      if (this.msgT > 0) txt(this.msg, W/2, MY, 44, '#ffd23f', 'center', 900);
    }
  };
  g.serve(randi(2) + 1); return g;
}

function makeHeadSoccer(){

        this.t -= dt;

          this.t = 0;
          if (this.sc[1] !== this.sc[2]){ this.winner = this.sc[1] > this.sc[2] ? 1 : 2; return; }

// ---------- Tetris ----------

    }

const popc = m => { let n = 0; while (m){ m &= m - 1; n++; } return n; };

    start(k){ this.lvl = k; const {sol, puz} = sdMake(CLUES[k]); this.sol = sol; this.given = puz.map(Boolean); this.g = puz.slice(); this.nt = Array.from({length:81}, () => new Set()); this.st = 'play'; this.t = 0; beep(600, .08); },

}

// ---------- Bomberman ----------
function makeBomber(){
  const C = 15, R = 11, S = 48, X0 = (W - C*S)/2, Y0 = 64;
  const DIRS = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]}, OPP = {up:'down', down:'up', left:'right', right:'left'};
  const ITEMS = {bomb:'💣', fire:'🔥', speed:'👟'}, PL = players(), CORN = {1:[1,1], 2:[C-2,R-2], 3:[C-2,1], 4:[1,R-2]};
  const g = {
    sc:[0,0,0,0,0], round:0, st:'play', t:0, msg:'',
    reset(){
      this.round++; this.map = []; this.bombs = []; this.fires = []; this.items = {}; this.st = 'play'; this.time = 0;
      const safe = new Set(); for (const [c, r] of Object.values(CORN)) for (const [dc, dr] of [[0,0],[1,0],[-1,0],[0,1],[0,-1]]) safe.add(`${c + dc},${r + dr}`);
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++){
        const hard = r === 0 || c === 0 || r === R - 1 || c === C - 1 || (r % 2 === 0 && c % 2 === 0);
        this.map.push(hard ? 1 : !safe.has(`${c},${r}`) && Math.random() < .72 ? 2 : 0);
      }
      const mkP = (c, r) => ({c, r, tc:c, tr:r, prog:0, alive:true, bombs:1, fire:2, spd:4.2, dir:'down', mv:null});
      this.pl = []; for (const p of PL) this.pl[p] = mkP(...CORN[p]);
    },
    at(c, r){ return this.map[r*C + c]; },
    bombAt(c, r){ return this.bombs.find(b => b.c === c && b.r === r); },
    walkable(c, r){ return c >= 0 && r >= 0 && c < C && r < R && this.at(c, r) === 0 && !this.bombAt(c, r); },
    cur(q){ return q.prog >= .5 ? [q.tc, q.tr] : [q.c, q.r]; },
    explode(b){
      this.bombs = this.bombs.filter(x => x !== b); beep(90, .35, 'sawtooth', .06);
      const cells = [[b.c, b.r]];
      for (const [dc, dr] of Object.values(DIRS)){
        for (let k = 1; k <= b.fire; k++){
          const c = b.c + dc*k, r = b.r + dr*k, v = this.at(c, r);
          if (v === 1) break;
          cells.push([c, r]);
          if (v === 2){ this.map[r*C + c] = 0; if (Math.random() < .32) this.items[r*C + c] = ['bomb','fire','speed'][randi(3)]; break; }
          delete this.items[r*C + c];
          const ob = this.bombAt(c, r); if (ob){ ob.t = Math.min(ob.t, .06); break; }
        }
      }
      for (const [c, r] of cells) this.fires.push({c, r, t:.55});
    },
    update(dt){
      if (this.st === 'end'){
        this.t -= dt;
        if (this.t <= 0){ const w = PL.find(p => this.sc[p] >= 3); if (w){ this.winner = w; this.res = scoreLine(PL, this.sc); } else this.reset(); }
        return;
      }
      this.time += dt;
      for (const p of PL){
        const q = this.pl[p]; if (!q.alive) continue;
        const moving = q.c !== q.tc || q.r !== q.tr;
        if (moving && isDown(p, OPP[q.mv]) && !isDown(p, q.mv)){ [q.c, q.tc] = [q.tc, q.c]; [q.r, q.tr] = [q.tr, q.r]; q.prog = 1 - q.prog; q.mv = OPP[q.mv]; q.dir = q.mv; }
        if (q.c !== q.tc || q.r !== q.tr){
          q.prog += q.spd*dt;
          if (q.prog >= 1){
            q.c = q.tc; q.r = q.tr; q.prog = 0;
            const it = this.items[q.r*C + q.c];
            if (it){ delete this.items[q.r*C + q.c]; beep(1000, .08, 'triangle'); if (it === 'bomb') q.bombs = Math.min(6, q.bombs + 1); else if (it === 'fire') q.fire = Math.min(8, q.fire + 1); else q.spd = Math.min(7, q.spd + .6); }
          }
        }
        if (q.c === q.tc && q.r === q.tr){
          for (const k of ['up','down','left','right']) if (isDown(p, k)){
            q.dir = k; const [dc, dr] = DIRS[k];
            if (this.walkable(q.c + dc, q.r + dr)){ q.tc = q.c + dc; q.tr = q.r + dr; q.prog = 0; q.mv = k; break; }
          }
        }
        if (act(p)){
          const [c, r] = this.cur(q);
          if (this.bombs.filter(b => b.owner === p).length < q.bombs && !this.bombAt(c, r)){ this.bombs.push({c, r, t:2.3, owner:p, fire:q.fire}); beep(300, .05); }
        }
      }
      for (const b of this.bombs.slice()){ b.t -= dt; if (b.t <= 0 && this.bombs.includes(b)) this.explode(b); }
      for (const f of this.fires) f.t -= dt; this.fires = this.fires.filter(f => f.t > 0);
      for (const p of PL){
        const q = this.pl[p]; if (!q.alive) continue; const [c, r] = this.cur(q);
        if (this.fires.some(f => f.c === c && f.r === r)){ q.alive = false; beep(120, .5, 'sawtooth', .08); }
      }
      const al = PL.filter(p => this.pl[p].alive);
      if (al.length < 2){
        this.st = 'end'; this.t = 2.2;
        if (al.length === 1){ this.sc[al[0]]++; this.msg = `${name(al[0])} remporte la manche !`; } else this.msg = 'Double K.O. ! Manche nulle';
      }
    },
    draw(){
      clear('#1d1d2b');
      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++){
        const x = X0 + c*S, y = Y0 + r*S, v = this.at(c, r);
        if (v === 1){ rrect(x, y, S, S, 6, '#5d6475'); rrect(x + 4, y + 4, S - 8, S - 8, 5, '#737b8f'); }
        else {
          ctx.fillStyle = (r + c) % 2 ? '#3f8f4a' : '#46994f'; ctx.fillRect(x, y, S, S);
          if (v === 2){ rrect(x + 2, y + 2, S - 4, S - 4, 5, '#a0612d'); ctx.fillStyle = '#7d4a20'; ctx.fillRect(x + 2, y + S/2 - 1, S - 4, 3); ctx.fillRect(x + S/2 - 1, y + 2, 3, S/2 - 2); ctx.fillRect(x + S/4, y + S/2, 3, S/2 - 2); ctx.fillRect(x + 3*S/4, y + S/2, 3, S/2 - 2); }
          else if (this.items[r*C + c]){ rrect(x + 6, y + 6, S - 12, S - 12, 8, '#ffffffcc'); txt(ITEMS[this.items[r*C + c]], x + S/2, y + S/2 + 1, 24); }
        }
      }
      for (const b of this.bombs){
        const x = X0 + b.c*S + S/2, y = Y0 + b.r*S + S/2, pul = 1 + Math.sin(b.t*14)*.07;
        circ(x + 2, y + 4, 17, '#0005'); circ(x, y, 17*pul, '#1a1a1a'); circ(x - 5, y - 5, 5, '#ffffff44');
        ctx.strokeStyle = '#c9a36b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 8, y - 12); ctx.lineTo(x + 13, y - 20); ctx.stroke();
        circ(x + 13, y - 21, 4 + Math.random()*2, Math.random() < .5 ? '#ffd23f' : '#ff8c1a');
      }
      for (const f of this.fires){ const x = X0 + f.c*S, y = Y0 + f.r*S, a = Math.min(1, f.t/.25); rrect(x + 2, y + 2, S - 4, S - 4, 10, `rgba(255,140,26,${a})`); rrect(x + 10, y + 10, S - 20, S - 20, 8, `rgba(255,230,120,${a})`); }
      for (const p of PL){
        const q = this.pl[p]; if (!q.alive) continue;
        const cx = X0 + (q.c + (q.tc - q.c)*q.prog)*S + S/2, cy = Y0 + (q.r + (q.tr - q.r)*q.prog)*S + S/2, [ex, ey] = DIRS[q.dir];
        circ(cx + 2, cy + 5, 18, '#0005'); circ(cx, cy, 18, P[p].color); circ(cx, cy - 2, 12, '#ffe6d5');
        circ(cx - 4 + ex*3, cy - 3 + ey*3, 2.5, '#111'); circ(cx + 4 + ex*3, cy - 3 + ey*3, 2.5, '#111');
      }
      PL.forEach((p, i) => {
        const q = this.pl[p], two = PL.length === 2, x = two ? (i ? W - 30 : 30) : W*(i + .5)/PL.length, al = two ? (i ? 'right' : 'left') : 'center';
        txt(`${name(p)} ${this.sc[p]}`, x, 20, 18, P[p].color, al); txt(`💣${q.bombs} 🔥${q.fire} 👟${Math.round((q.spd - 4.2)/.6) + 1}`, x, 42, 12, q.alive ? '#ccc' : '#666', al, 600);
      });
      if (PL.length === 2) txt(`Manche ${this.round} · premier à 3`, W/2, 30, 16, '#9a9ab0', 'center', 600);
      if (this.st === 'end'){ rrect(W/2 - 260, H/2 - 40, 520, 80, 16, '#000d'); txt(this.msg, W/2, H/2, 30, '#ffd23f'); }
    }
  };
  g.reset(); return g;
}

// ---------- Space Invaders ----------
const INV_SPR = {
  squid:[['   ##   ','  ####  ',' ###### ','## ## ##','########','  #  #  ',' # ## # ','# #  # #'],
         ['   ##   ','  ####  ',' ###### ','## ## ##','########',' # ## # ','#      #',' #    # ']],
  crab:[['  #     #  ','   #   #   ','  #######  ',' ## ### ## ','###########','# ####### #','# #     # #','   ## ##   '],
        ['  #     #  ','#  #   #  #','# ####### #','### ### ###','###########',' ######### ','  #     #  ',' #       # ']],
  octo:[['    ####    ',' ########## ','############','###  ##  ###','############','   ##  ##   ','  ## ## ##  ','##        ##'],
        ['    ####    ',' ########## ','############','###  ##  ###','############','  ###  ###  ',' ##  ##  ## ','  ##    ##  ']]
};
const INV_COL = {squid:'#d57bff', crab:'#5cc8ff', octo:'#6dff8a'};
function sprite(rows, x, y, px, col){
  const w = rows[0].length*px, h = rows.length*px; ctx.fillStyle = col;
  rows.forEach((row, r) => { for (let c = 0; c < row.length; c++) if (row[c] === '#') ctx.fillRect(x - w/2 + c*px, y - h/2 + r*px, px, px); });
}
function makeInvaders(){
  const PY = 552;
  const stars = Array.from({length:70}, () => [rand(0, W), rand(0, H), rand(.5, 1.8)]);
  const g = {
    px:W/2, lives:3, sc:0, lvl:0, shot:null, eshots:[], ufo:null, ufoT:rand(14, 22), dead:0, over:false, t:0, frame:0, stepT:0, dir:1, goDown:false, booms:[], note:0,
    wave(){
      this.lvl++; this.inv = []; const top = 110 + Math.min(4, this.lvl - 1)*16;
      for (let r = 0; r < 5; r++){ const type = r === 0 ? 'squid' : r < 3 ? 'crab' : 'octo'; for (let c = 0; c < 11; c++) this.inv.push({x:170 + c*52, y:top + r*42, type, pts:r === 0 ? 30 : r < 3 ? 20 : 10, w:type === 'squid' ? 24 : type === 'crab' ? 33 : 36}); }
      this.dir = 1; this.goDown = false; this.stepT = 0; this.shot = null; this.eshots = [];
    },
    bunkers(){
      this.blocks = [];
      for (let b = 0; b < 4; b++){ const bx = 150 + b*200 - 44, by = 450;
        for (let r = 0; r < 14; r++) for (let c = 0; c < 22; c++){
          if (r < 3 && (c < 3 - r || c > 18 + r)) continue;
          if (r >= 9 && c >= 7 && c <= 14) continue;
          this.blocks.push({x:bx + c*4, y:by + r*4, on:true});
        } }
    },
    hitBlocks(x, y, w, h, rad = 0){
      let hitb = false;
      for (const b of this.blocks) if (b.on && b.x < x + w/2 && b.x + 4 > x - w/2 && b.y < y + h/2 && b.y + 4 > y - h/2){ hitb = true; break; }
      if (hitb && rad) for (const b of this.blocks) if (b.on && Math.hypot(b.x + 2 - x, b.y + 2 - y) < rad && Math.random() < .8) b.on = false;
      return hitb;
    },
    boom(x, y, col){ this.booms.push({x, y, t:.35, col}); },
    update(dt){
      for (const b of this.booms) b.t -= dt; this.booms = this.booms.filter(b => b.t > 0);
      if (this.over){ this.t -= dt; if (this.t <= 0) finishSolo(this, 'invaders', this.sc, `Score : ${this.sc} · vague ${this.lvl}`); return; }
      if (this.dead > 0){ this.dead -= dt; if (this.dead <= 0 && this.lives <= 0){ this.over = true; this.t = 1.2; } return; }
      this.px = clamp(this.px + ((sDown('right')?1:0) - (sDown('left')?1:0))*380*dt, 30, W - 30);
      if ((sAct() || sHit('up')) && !this.shot){ this.shot = {x:this.px, y:PY - 20}; beep(900, .04, 'square', .025); }
      if (this.shot){
        const s = this.shot; s.y -= 760*dt;
        if (s.y < 40) this.shot = null;
        else if (this.hitBlocks(s.x, s.y, 3, 14, 7)) this.shot = null;
        else {
          const iv = this.inv.find(v => Math.abs(v.x - s.x) < v.w/2 + 2 && Math.abs(v.y - s.y) < 14);
          if (iv){ this.sc += iv.pts; this.boom(iv.x, iv.y, INV_COL[iv.type]); this.inv = this.inv.filter(v => v !== iv); this.shot = null; beep(200, .1, 'sawtooth', .04); }
          else if (this.ufo && Math.abs(this.ufo.x - s.x) < 26 && Math.abs(70 - s.y) < 14){ const pts = [50,100,150,300][randi(4)]; this.sc += pts; this.booms.push({x:this.ufo.x, y:70, t:1, col:'#ff4d4d', txt:pts}); this.ufo = null; this.shot = null; beep(1200, .3, 'triangle'); }
        }
      }
      const n = this.inv.length;
      if (!n){ this.sc += 100*this.lvl; this.wave(); beep(990, .3, 'triangle'); return; }
      this.stepT += dt;
      const iv = Math.max(.022, .6*n/55) * Math.pow(.88, this.lvl - 1);
      if (this.stepT >= iv){
        this.stepT = 0; this.frame ^= 1; beep([110, 98, 87, 82][this.note++ % 4], .06, 'square', .03);
        if (this.goDown){ for (const v of this.inv) v.y += 18; this.dir *= -1; this.goDown = false; }
        else { for (const v of this.inv) v.x += this.dir*10; if (this.inv.some(v => v.x + v.w/2 > W - 20 || v.x - v.w/2 < 20)) this.goDown = true; }
        for (const v of this.inv) this.hitBlocks(v.x, v.y, v.w, 24, 20);
        if (this.inv.some(v => v.y + 12 > PY - 16)){ this.lives = 0; this.dead = 1; this.boom(this.px, PY, '#6dff8a'); beep(80, .6, 'sawtooth', .08); return; }
      }
      if (Math.random() < (.9 + this.lvl*.3)*dt){
        const cols = {}; for (const v of this.inv){ const k = Math.round(v.x); if (!cols[k] || cols[k].y < v.y) cols[k] = v; }
        const sh = Object.values(cols)[randi(Object.keys(cols).length)];
        this.eshots.push({x:sh.x, y:sh.y + 14, vy:250 + this.lvl*20, z:Math.random() < .5});
      }
      for (const e of this.eshots){
        e.y += e.vy*dt;
        if (this.hitBlocks(e.x, e.y, 3, 12, 8)) e.done = true;
        else if (Math.abs(e.x - this.px) < 20 && e.y > PY - 14 && e.y < PY + 12){
          e.done = true; this.lives--; this.dead = 1.3; this.eshots = []; this.boom(this.px, PY, '#6dff8a'); beep(80, .6, 'sawtooth', .08); return;
        }
        if (e.y > H) e.done = true;
      }
      this.eshots = this.eshots.filter(e => !e.done);
      this.ufoT -= dt;
      if (this.ufoT <= 0 && !this.ufo){ const l = Math.random() < .5; this.ufo = {x:l ? -40 : W + 40, vx:l ? 150 : -150}; }
      if (this.ufo){ this.ufo.x += this.ufo.vx*dt; if (this.ufo.x < -60 || this.ufo.x > W + 60){ this.ufo = null; this.ufoT = rand(14, 22); } }
      if (!this.ufo && this.ufoT <= 0) this.ufoT = rand(14, 22);
    },
    draw(){

  trs(x, y, z, ry = 0, s = 1, rx = 0){

const KART_HW = 7.5;
function kartTrack(){
  if (G3.cache.track) return G3.cache.track;
  const CP = [[0,-80],[70,-90],[120,-60],[130,0],[100,40],[50,30],[20,60],[40,100],[0,130],[-60,120],[-110,80],[-120,10],[-90,-50],[-50,-80]].map(([x, z]) => [x*1.3, z*1.3]);
  const SEG = 24, pts = [];
  for (let i = 0; i < CP.length; i++){
    const p0 = CP[(i - 1 + CP.length) % CP.length], p1 = CP[i], p2 = CP[(i + 1) % CP.length], p3 = CP[(i + 2) % CP.length];
    for (let j = 0; j < SEG; j++){
      const t = j/SEG, t2 = t*t, t3 = t2*t;
      pts.push([0,1].map(k => .5*(2*p1[k] + (-p0[k] + p2[k])*t + (2*p0[k] - 5*p1[k] + 4*p2[k] - p3[k])*t2 + (-p0[k] + 3*p1[k] - 3*p2[k] + p3[k])*t3)));
    }
  }
  const N = pts.length, tan = [], side = [], cum = [0];
  for (let i = 0; i < N; i++){
    const a = pts[(i - 1 + N) % N], b = pts[(i + 1) % N], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    tan.push([(b[0] - a[0])/l, (b[1] - a[1])/l]); side.push([tan[i][1], -tan[i][0]]);
    if (i) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  }
  const total = cum[N - 1] + Math.hypot(pts[0][0] - pts[N - 1][0], pts[0][1] - pts[N - 1][1]);
  return G3.cache.track = {pts, tan, side, cum, total, N};
}

    const s = .8 + rnd()*.7, g = rnd() < .5 ? '#2e7d32' : '#388e3c';

}

    rank(p){ return this.order().indexOf(p) + 1; },
    hitKart(k){ if (k.spin > 0) return; k.spin = 1.3; k.speed *= .25; beep(140, .35, 'sawtooth', .06); },

    update(dt){

          else if (k.lap < LAPS){ this.msg = k.lap === LAPS - 1 ? `🔔 Dernier tour pour ${name(p)} !` : `${name(p)} : tour ${k.lap + 1}`; this.msgT = 1.8; beep(990, .15, 'triangle'); }

const menuCards = () => [...document.querySelectorAll('#rows .gcard')];
function markSel(scroll = true){
  const cs = menuCards(); menuSel = clamp(menuSel, 0, Math.max(0, cs.length - 1));

function menuNav(code){
  const cs = menuCards(); if (!cs.length) return;
  if (code === 'ArrowRight') menuSel = Math.min(cs.length - 1, menuSel + 1);
  else if (code === 'ArrowLeft') menuSel = Math.max(0, menuSel - 1);
  else {
    const r0 = cs[menuSel].getBoundingClientRect(), cx = r0.left + r0.width/2, dn = code === 'ArrowDown'; let best = -1, bd = Infinity;
    cs.forEach((c, i) => { const r = c.getBoundingClientRect(), dy = dn ? r.top - r0.top : r0.top - r.top; if (dy <= 5) return; const d = dy*3 + Math.abs(r.left + r.width/2 - cx); if (d < bd){ bd = d; best = i; } });
    if (best >= 0) menuSel = best;
  }
  markSel();
}

function nextGame(){
  if (!tour.queue.length){ const np = players().length; tour.queue = GAMES.filter(g => !g.noTour && !g.solo && (np <= 2 || (g.maxP || 2) >= np)).sort(() => Math.random() - .5); if (gdef && tour.queue[0] === gdef) tour.queue.push(tour.queue.shift()); }

function next(){

    s.onload = () => res(); s.onerror = () => rej(new Error('Impossible de charger le module réseau (connexion internet ?)'));

}
const netCodeGen = () => Array.from({length:4}, () => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[randi(31)]).join('');
function netBroadcast(m){ for (const mb of NET.members) if (mb.conn && mb.conn.open) mb.conn.send(m); }
function netSend(m){ if (NET.host && NET.host.open) NET.host.send(m); }
const netInviteLink = () => siteUrl() ? `${siteUrl()}?salon=${NET.code}` : '';
function netMembersMsg(){ return {t:'members', code:NET.code, list:NET.members.map(m => ({id:m.id, name:m.name, slot:m.slot}))}; }
function netApplyNames(){ for (const s of [1,2,3,4]){ const m = NET.members.find(x => x.slot === s); if (m) P[s].name = m.name; } }
function netUpdate(){ netApplyNames(); netBroadcast(netMembersMsg()); renderNetBtn(); if ($('online').classList.contains('on')) renderOnline(); if (phase === 'menu') renderMenu(); }

// Serveurs qui aident deux appareils à se trouver (STUN) + relais optionnel (TURN) si le réseau bloque la connexion directe

function netIce(){
  const ice = [{urls:['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302']}, {urls:'stun:stun.cloudflare.com:3478'}];
  const t = getTurn();
  if (t && t.urls) ice.push({urls:t.urls.split(/[\s,]+/).filter(Boolean), username:t.user, credential:t.pass});

        let found = false; pc.createDataChannel('t');

// ---------- Hôte ----------
async function netHost(myName){
  NET.err = ''; renderOnline('wait');
  try { await loadPeerJS(); } catch (e){ NET.err = e.message; return renderOnline(); }
  const tryOpen = (n) => {
    const code = netCodeGen(), peer = new Peer(NET_PREFIX + code.toLowerCase(), netIce());
    peer.on('open', () => {
      NET.role = 'host'; NET.peer = peer; NET.code = code; NET.mySlot = 1;
      NET.members = [{id:'host', name:myName, slot:1, keys:new Set()}];
      netMakeStream(); netUpdate(); renderOnline();
    });
    peer.on('connection', conn => netOnConnection(conn));
    peer.on('error', e => {
      if (e.type === 'unavailable-id' && n < 5){ peer.destroy(); return tryOpen(n + 1); }
      if (NET.role !== 'host'){ NET.err = 'Erreur réseau : ' + e.type; renderOnline(); }
    });
    peer.on('disconnected', () => { if (NET.role === 'host') peer.reconnect(); });
  };
  tryOpen(0);
}
function netMakeStream(){
  NET.sc = document.createElement('canvas'); NET.sc.width = 1152; NET.sc.height = 720; NET.sctx = NET.sc.getContext('2d');
  NET.stream = NET.sc.captureStream(30);
  try { AC = AC || new AudioContext(); NET.adest = AC.createMediaStreamDestination(); NET.stream.addTrack(NET.adest.stream.getAudioTracks()[0]); } catch (e){}
}
function netOnConnection(conn){
  conn.on('data', m => {
    if (m.t === 'join'){
      if (NET.members.length >= 4){ conn.send({t:'full'}); setTimeout(() => conn.close(), 300); return; }
      const taken = new Set(NET.members.map(x => x.slot));
      const mb = {id:conn.peer, name:String(m.name || 'Invité').slice(0, 14), slot:[2,1,3,4].find(x => !taken.has(x)) || 0, keys:new Set(), conn};
      NET.members.push(mb);
      conn.send({t:'hello', you:conn.peer});
      netUpdate(); netSendUi(conn);
      if (NET.stream) NET.peer.call(conn.peer, NET.stream);
      beep(880, .1, 'triangle');
      return;
    }
    const mb = NET.members.find(x => x.id === conn.peer); if (!mb) return;
    if (m.t === 'k') netRemoteKey(m, mb);
    else if (m.t === 'm'){ if (phase === 'play' && game && game.mouse && mb.slot && netMayClick(mb.slot)) game.mouse(m.type, m.x, m.y, {button:m.b, shiftKey:m.sh, altKey:m.al, ctrlKey:false}); }
    else if (m.t === 'text'){ const v = String(m.v).slice(0, 90); if (game && game.netText) game.netText(v, mb.slot); else if (gui.cb) gui.cb(v); }
  });
  conn.on('close', () => {
    const mb = NET.members.find(x => x.id === conn.peer);
    if (mb){ for (const k of mb.keys) down.delete(k); NET.members = NET.members.filter(x => x !== mb); netUpdate(); }
  });
}
const netMayClick = slot => { const t = game && game.turnSlot ? game.turnSlot() : 0; return !t || t === slot; };
function netRemoteKey(m, mb){
  if (phase === 'menu' || m.code === 'Escape') return;
  const code = m.code === 'Space' ? 'Space' : netMap(m.code, mb.slot);
  if (!code) return;
  if (m.dn){
    if (!down.has(code)){ pressed.set(code, performance.now()); if (m.key && m.key.length === 1) typed.push(m.key); }
    down.add(code); mb.keys.add(code); onKey(code);
  } else { down.delete(code); mb.keys.delete(code); }
}
function netSetSlot(id, slot){
  const mb = NET.members.find(x => x.id === id); if (!mb) return;
  if (slot) for (const o of NET.members) if (o !== mb && o.slot === slot) o.slot = mb.slot === slot ? 0 : mb.slot;
  mb.slot = slot; NET.mySlot = (NET.members.find(x => x.id === 'host') || {}).slot || 0;
  for (const o of NET.members) for (const k of o.keys) down.delete(k);
  netUpdate();
}
function netSendUi(target){
  if (NET.role !== 'host') return;
  const scr = ['menu','intro','result'].find(s => $(s).classList.contains('on')) || null;
  const m = {t:'ui', screen:scr, html:scr === 'intro' ? $('introCard').innerHTML : scr === 'result' ? $('resultCard').innerHTML : ''};
  if (target) target.send(m); else netBroadcast(m);
}
function netFrame(){
  if (NET.role !== 'host' || !NET.sctx || NET.members.length < 2) return;
  const now = performance.now();
  if (now - (NET.pvT || 0) > 100){
    NET.pvT = now; const on = !!(game && game.netState && game.online && (phase === 'play' || phase === 'countdown'));
    for (const mb of NET.members) if (mb.conn && mb.conn.open){
      if (on){ mb.conn.send({t:'pv', id:gdef.id, s:game.netState(mb.slot)}); mb.pv = true; }
      else if (mb.pv){ mb.conn.send({t:'pv', off:true}); mb.pv = false; }
    }
  }
  const x = NET.sctx; x.fillStyle = '#0b0b14'; x.fillRect(0, 0, 1152, 720);
  if (shown3d) x.drawImage(document.getElementById('c3d'), 0, 0, 1152, 720);
  x.drawImage(cv, 0, 0, 1152, 720);
}
function netLeave(){
  try { if (NET.peer) NET.peer.destroy(); } catch (e){}
  const wasGuest = NET.role === 'guest';
  Object.assign(NET, {role:null, peer:null, code:'', members:[], stream:null, sc:null, sctx:null, adest:null, host:null, mySlot:1, err:''});
  P[1].name = $('n1').value || 'Rouge'; P[2].name = $('n2').value || 'Bleu'; P[3].name = 'Vert'; P[4].name = 'Jaune';
  try { const s = JSON.parse(localStorage.getItem('duelparty') || '{}'); if (s.n1) P[1].name = s.n1; if (s.n2) P[2].name = s.n2; } catch (e){}
  if (wasGuest){ $('netView').classList.remove('on'); $('lobby').classList.remove('on'); $('wrap').style.display = ''; gui.close(); document.body.classList.remove('guest', 'pv'); NET.pv = null; NET.pvGui = false; }
  renderNetBtn(); toMenu();
}

// ---------- Invité ----------
async function netJoin(code, myName){
  code = code.trim().toUpperCase(); NET.err = '';
  if (code.length < 4){ NET.err = 'Code de salon invalide'; return renderOnline(); }
  renderOnline('wait', '📦 Chargement du module réseau…');
  try { await loadPeerJS(); } catch (e){ NET.err = e.message; return renderOnline(); }
  renderOnline('wait', '📡 Connexion au serveur de mise en relation…');
  const peer = new Peer(netIce());
  let settled = false;
  const fail = msg => {
    if (settled) return; settled = true; clearTimeout(timer);
    try { peer.destroy(); } catch (e){}
    NET.err = msg; renderOnline();
  };
  const BLOCKED = 'Impossible de joindre l\'ordi de l\'hôte : le réseau bloque la connexion directe. Essaie de te mettre sur le même Wi-Fi que lui, ou demande-lui d\'activer un relais (⚙️ Réglages réseau dans la fenêtre du salon).';
  const timer = setTimeout(() => fail(NET.stage === 'server' ? 'Le serveur de mise en relation ne répond pas. Vérifie ta connexion internet.' : BLOCKED), 18000);
  NET.stage = 'server';
  peer.on('open', id => {
    NET.myId = id; NET.stage = 'host';
    renderOnline('wait', `🔎 Connexion au salon ${code}…`);
    const conn = peer.connect(NET_PREFIX + code.toLowerCase(), {reliable:true});
    conn.on('iceStateChanged', st => { if (st === 'failed') fail(BLOCKED); });
    conn.on('open', () => {
      if (settled) return; settled = true; clearTimeout(timer);
      NET.role = 'guest'; NET.peer = peer; NET.host = conn; NET.code = code;
      conn.send({t:'join', name:myName});
      $('online').classList.remove('on'); show(null); $('wrap').style.display = 'none'; $('netView').classList.add('on'); $('lobby').classList.add('on'); document.body.classList.add('guest'); renderLobby();
      const v = $('netVideo'); v.muted = false; resize();
    });
    conn.on('data', m => netGuestData(m));
    conn.on('close', () => { if (NET.role === 'guest'){ netLeave(); NET.err = 'La connexion avec l\'hôte est terminée.'; openOnline(); } });
  });
  peer.on('call', call => {
    call.answer();
    call.on('stream', s => { const v = $('netVideo'); v.srcObject = s; v.play().catch(() => { v.muted = true; v.play(); $('lobbyInfo').textContent = '🔇 Clique n\'importe où pour activer le son'; }); });
  });
  peer.on('error', e => { if (NET.role === 'guest') return; fail(e.type === 'peer-unavailable' ? `Salon ${code} introuvable 😕 (vérifie le code, et que le salon de l'hôte est toujours ouvert)` : 'Erreur réseau : ' + e.type); });
}
function netGuestData(m){
  if (m.t === 'members'){ NET.members = m.list; NET.code = m.code; const me = m.list.find(x => x.id === NET.myId); NET.mySlot = me ? me.slot : 0; renderLobby(); }
  else if (m.t === 'full'){ NET.err = 'Ce salon est complet (4 joueurs max).'; }
  else if (m.t === 'ui'){
    if (m.screen === 'menu'){ show(null); $('lobby').classList.add('on'); renderLobby(); }
    else {
      $('lobby').classList.remove('on');
      if (m.screen === 'intro') $('introCard').innerHTML = m.html;
      if (m.screen === 'result') $('resultCard').innerHTML = m.html;
      show(m.screen);
    }
  }
  else if (m.t === 'pv'){
    const d = !m.off && GAMES.find(g => g.id === m.id);
    if (!d){ if (NET.pv){ NET.pv = null; document.body.classList.remove('pv'); $('wrap').style.display = 'none'; $('netView').classList.add('on'); } if (NET.pvGui){ NET.pvGui = false; gui.close(); } return; }
    if (!NET.pv){ document.body.classList.add('pv'); $('wrap').style.display = ''; $('netView').classList.remove('on'); resize(); }
    NET.pv = m;
    const ph = d.pvGui ? d.pvGui(m.s, NET.mySlot) : null;
    if (ph && !NET.pvGui){ NET.pvGui = true; gui.open(ph, false, v => { netSend({t:'text', v}); gui.close(); }, 72); }
    else if (!ph && NET.pvGui){ NET.pvGui = false; gui.close(); }
  }
  else if (m.t === 'gui'){ if (m.open) gui.open(m.ph, m.idea, v => { netSend({t:'text', v}); gui.close(); }, m.y, m.secret); else gui.close(); }
}
function renderLobby(){
  const me = NET.members.find(x => x.id === NET.myId);
  $('lobbyCard').innerHTML = `<div class="tag">🌐 Salon ${esc(NET.code)}</div><h2>Connecté !</h2>

    <button class="rand" onclick="netLeave()">🚪 Quitter le salon</button>`;
}
