  if (!e.repeat && !NET.held.has(code)){ NET.held.add(code); netSend({t:'k', code, key:e.key, dn:true}); }
}, true);
addEventListener('keyup', e => { if (NET.role !== 'guest') return; const code = keyCode(e); if (NET.held.delete(code)) netSend({t:'k', code, key:e.key, dn:false}); }, true);
addEventListener('blur', () => { if (NET.role !== 'guest') return; for (const code of NET.held) netSend({t:'k', code, dn:false}); NET.held.clear(); });
function netVideoPos(e){ const r = (NET.pv ? cv : $('netVideo')).getBoundingClientRect(); return {x:(e.clientX - r.left)/r.width*W, y:(e.clientY - r.top)/r.height*H}; }
$('netVideo').addEventListener('pointerdown', e => { const v = $('netVideo'); if (v.muted){ v.muted = false; v.play(); } const p = netVideoPos(e); netSend({t:'m', type:'down', ...p, b:e.button, sh:e.shiftKey, al:e.altKey}); });
$('netVideo').addEventListener('contextmenu', e => e.preventDefault());
addEventListener('pointerup', e => { if (NET.role === 'guest') netSend({t:'m', type:'up', ...netVideoPos(e), b:e.button}); });
addEventListener('pointermove', e => { if (NET.role !== 'guest') return; const t = performance.now(); if (t - NET.lastMove < 33) return; NET.lastMove = t; netSend({t:'m', type:'move', ...netVideoPos(e)}); });
$('netBtn').onclick = openOnline;
cv.addEventListener('pointerdown', e => { if (NET.role === 'guest' && NET.pv) netSend({t:'m', type:'down', ...netVideoPos(e), b:e.button, sh:e.shiftKey, al:e.altKey}); });
// ---------- Téléphone : écran « Rejoindre » direct + manette tactile ----------
const MOBILE = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820;
if (MOBILE){ document.body.classList.add('mobile'); setTimeout(openOnline, 50); }
for (const b of document.querySelectorAll('#pad [data-k]')){
  const code = b.dataset.k, up = () => { if (b.classList.contains('on')){ b.classList.remove('on'); netSend({t:'k', code, dn:false}); } };
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!b.classList.contains('on')){ b.classList.add('on'); netSend({t:'k', code, key:code === 'Space' ? ' ' : '', dn:true}); if (navigator.vibrate) navigator.vibrate(8); }
    try { b.setPointerCapture(e.pointerId); } catch (err){}
  });
  for (const ev of ['pointerup','pointercancel','lostpointercapture']) b.addEventListener(ev, up);
}
$('padToggle').onclick = () => $('pad').classList.toggle('hide');
if (!MOBILE && new URLSearchParams(location.search).get('salon')) setTimeout(openOnline, 300);

// ---------- Boucle principale ----------
const dots = Array.from({length:40}, () => ({x:rand(0,W), y:rand(0,H), r:rand(4,14), vx:rand(-30,30), vy:rand(-30,30), p:randi(2)+1}));
let last = performance.now();
let shown3d = false;
function loop(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (NET.role === 'guest' && NET.pv){
    const d = GAMES.find(g => g.id === NET.pv.id); if (d) d.drawPrivate(NET.pv.s, NET.mySlot);
    pressed.clear(); typed.length = 0; return requestAnimationFrame(loop);
  }
  const want3d = !!(game && game.is3d && phase !== 'menu');
  if (want3d !== shown3d){ shown3d = want3d; document.getElementById('c3d').style.display = want3d ? 'block' : 'none'; cv.style.background = want3d ? 'transparent' : ''; }
  if (phase === 'countdown'){
    game.draw(); ctx.fillStyle = '#000a'; ctx.fillRect(0,0,W,H);
    const before = Math.ceil(cd); cd -= dt; const after = Math.ceil(cd);
    if (after !== before && after > 0) beep(440, .1);
    if (cd <= 0){ phase = 'play'; beep(880, .15); pressed.clear(); }
    else { const f = cd - Math.floor(cd); txt(Math.ceil(cd), W/2, H/2, 140 + f*60, '#ffd23f', 'center', 900); txt(gdef.name, W/2, H/2 + 130, 28, '#fff', 'center', 700); }
  } else if (phase === 'play'){
    game.update(dt); game.draw();
    if (game.winner !== undefined) endGame(game.winner);
  } else if (phase === 'champion'){
    clear('#0b0b14');
    for (const c of confetti){ c.y += c.vy*dt; c.x += c.vx*dt; c.r += dt*5; if (c.y > H + 10) c.y = -10; ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-5,-3,10,6); ctx.restore(); }
    txt('👑', W/2, 170, 110);
    txt(name(champ), W/2, 290, 72, P[champ].color, 'center', 900);
    txt('remporte le tournoi !', W/2, 360, 36);
    txt(players().length > 2 ? players().map(p => tour.sc[p]).join(' – ') : `${tour.sc[1]} – ${tour.sc[2]}`, W/2, 430, 40, '#ffd23f');
    txt('Espace pour revenir au menu', W/2, 530, 20, '#9a9ab0', 'center', 600);
  } else if (phase === 'menu'){
    clear();
    for (const d of dots){ d.x = (d.x + d.vx*dt + W) % W; d.y = (d.y + d.vy*dt + H) % H; circ(d.x, d.y, d.r, P[d.p].color + '44'); }
  } else if (game) game.draw();
  netFrame();
  pressed.clear(); typed.length = 0;
  requestAnimationFrame(loop);
}
renderMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
